# ============================================================
# CI Pipeline - Continuous Integration
# ============================================================
# This workflow runs on every push and pull request to main.
# It demonstrates:
#   - Workflow triggers
#   - Jobs (test, lint, build, security-check)
#   - Steps within each job
#   - Runners (ubuntu-latest)
#   - Artifacts (build output uploaded)
#   - Job dependencies (needs keyword)
# ============================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Test Application
  # Runner: ubuntu-latest (GitHub-hosted runner)
  # ──────────────────────────────────────────────
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v --tb=short

  # ──────────────────────────────────────────────
  # Job 2: Lint / Code Quality
  # Runs in parallel with test job
  # ──────────────────────────────────────────────
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 linter
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ──────────────────────────────────────────────
  # Job 3: Build Application
  # Depends on: test (runs only after tests pass)
  # Produces: Artifacts
  # ──────────────────────────────────────────────
  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show build output
        run: |
          cat build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/

  # ──────────────────────────────────────────────
  # Job 4: Security Check
  # Depends on: test (runs after tests pass)
  # Demonstrates: secrets awareness
  # ──────────────────────────────────────────────
  security-check:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          echo "========================================="
          echo "  Security Scan - Sensitive File Check"
          echo "========================================="
          if find . -type f \( \
            -name ".env" \
            -o -name "*.pem" \
            -o -name "*.key" \
            -o -name "*.secret" \
          \) | grep -q .; then
            echo "⚠️  Potential sensitive file found!"
            exit 1
          else
            echo "✅ No common sensitive files found."
          fi

      - name: Verify secrets are not hardcoded
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r "password\s*=" app/ --include="*.py" | grep -v "# noqa"; then
            echo "⚠️  Possible hardcoded password found!"
            exit 1
          else
            echo "✅ No hardcoded passwords detected."
          fi
