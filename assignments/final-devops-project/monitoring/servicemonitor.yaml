apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskboard-backend-metrics
  namespace: taskboard
  labels:
    release: prometheus
    app: taskboard-backend
spec:
  selector:
    matchLabels:
      app: taskboard-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
